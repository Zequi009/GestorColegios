<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=sync"
        rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/header.css">
    <link rel="stylesheet" href="CSS/sidebar.css">
    <link rel="stylesheet" href="CSS/views.css">
</head>

<body>
    <header class="app-header">
        <button id="btnToggleSidebar" class="header-button" aria-label="Abrir menú">
            <span class="header-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
                </svg>
            </span>
        </button>
        <div class="global-search">
            <span class="header-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.28.27v.79L20 21.49 21.49 20l-5.99-6zM10 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"></path>
                </svg>
            </span>
            <input id="busquedaGlobal" type="text" placeholder="Buscar en Dijini..." aria-label="Buscar en Dijini">
            <div id="resultadosBusquedaGlobal" class="global-search-results"></div>
        </div>

        <button id="btnConfiguracion" class="header-button" aria-label="Configuración">
            <span class="header-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94L14.37 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4l-.36 2.52c-.59.23-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.64 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.08.62-.08.94s.03.64.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.21.37.3.61.22l2.39-.96c.5.39 1.04.71 1.63.94l.36 2.52c.04.23.24.4.49.4h3.84c.25 0 .45-.17.49-.4l.36-2.52c.59-.23 1.13-.55 1.63-.94l2.39.96c.24.09.49-.01.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"></path>
                </svg>
            </span>
        </button>
    </header>

    <div class="app-layout">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <img src="assets/images/Mascota.png" alt="Dijini" class="sidebar-logo">
                <span class="sidebar-brand-text">Dijini</span>
            </div>
            <nav class="sidebar-nav">
                <button class="sidebar-link active" data-view="dashboard">
                    <span class="sidebar-icon" aria-label="Dashboard">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 13h8V3H3v10z"></path>
                            <path d="M13 21h8v-8h-8v8z"></path>
                            <path d="M13 3h8v6h-8V3z"></path>
                            <path d="M3 21h8v-6H3v6z"></path>
                        </svg>
                    </span>
                    <span class="sidebar-text">Dashboard</span>
                </button>

                <button class="sidebar-link" data-view="colegios">
                    <span class="sidebar-icon" aria-label="Colegios">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 10.5 12 4l9 6.5"></path>
                            <path d="M5 9.5V19h14v-9.5"></path>
                            <path d="M9 19v-6h6v6"></path>
                        </svg>
                    </span>
                    <span class="sidebar-text">Colegios</span>
                </button>

                <button class="sidebar-link" data-view="usuarios">
                    <span class="sidebar-icon" aria-label="Usuarios">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M16 19v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1"></path>
                            <circle cx="10" cy="7" r="3"></circle>
                            <path d="M20 19v-1a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </span>
                    <span class="sidebar-text">Usuarios</span>
                </button>

                <button class="sidebar-link" data-view="workspace">
                    <span class="sidebar-icon" aria-label="Workspace">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"></path>
                            <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <path d="M4 11h16"></path>
                        </svg>
                    </span>
                    <span class="sidebar-text">Correos CERI</span>
                </button>

            </nav>
            <div class="sidebar-status">
                <span id="estadoBaseDatosSidebar" class="status-indicator comprobando"></span>

                <div class="status-info">
                    <strong>SQL Server</strong>
                    <small id="textoEstadoBaseDatosSidebar">
                        Comprobando...
                    </small>
                </div>
            </div>
        </aside>

        <main id="mainContent" class="main-content">
            <!-- Acá se cargará el contenido central -->
        </main>
    </div>
    <script src="Js/header.js"></script>
    <script src="Js/sidebar.js"></script>
    <script src="./Js/utils/notificaction.js"></script>
    <script src="./Js/utils/validators.js"></script>
    <script src="./Js/utils/formatters.js"></script>
    <script src="Js/utils/confirmation.js"></script>
    <script src="Js/controllers/ColegiosController.js"></script>
    <script src="Js/router.js"></script>
    <script src="Js/app.js"></script>

</body>

</html>
